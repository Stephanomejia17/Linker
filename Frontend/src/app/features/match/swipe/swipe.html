<div class="card-section">
  @for(v of list; track v.title) {
  <div class="cards"
       #card
       (pointerdown)="onPointerDown($event)"
       (pointermove)="onPointerMove($event)"
       (pointerup)="onPointerUp()"
       >

    <div class="card-content">
      <div class="card-image-container">
        <img alt="Card Image" class="card-image" />
        <div class="distance-badge">{{ v.location }}</div>
        <button class="filter-btn" (click)="filterActivated()">
            <img class="filter-icon" alt="filter" src="assets/img/match-filter-icon.webp" />
        </button>
      </div>
      <div class="card-info">
        <div class="title">
          <div class="card-name">{{ v.title }}</div>
          <div class="card-salary">{{ v.salary }}</div>
        </div>
        <div class="card-description">{{ v.description }}</div>
        <div class="tags">
          @for(tag of v.tags; track tag) {
          <div class="tag">{{ tag }}</div>
          }
        </div>
        <div class="tags">
          @for(tag of v.language; track tag) {
          <div class="tag-language">{{ tag }}</div>
          }
        </div>
        <div class="info-row">
          <div class="info-item">
            <span><img src="assets/img/compania.png" alt="Company" class="emoji" /></span>
            {{ v.company }}
          </div>
          <div class="info-item">
            <span><img src="assets/img/reloj-en.png" alt="Schedule" class="emoji" /></span>
            {{ v.schedule }}
          </div>
        </div>
      </div>
    </div>
  </div>
  }
</div>
