<div class="card-section">
  @if(list.length===0){
    
          <button class="btn-refresh" (click)="getCards()">
            ¡Carguemos Vacantes!
          </button>
  
  }
  @else{
  @for(v of list; track v.id_vacante) {
  <div class="cards"
       #card
       (pointerdown)="onPointerDown($event)"
       (pointermove)="onPointerMove($event)"
       (pointerup)="onPointerUp(v)"
       >

    <div class="card-content">
      <div class="card-image-container">
        <img alt="Card Image" class="card-image" />
        <div class="distance-badge">{{ v.ubicacion }}</div>
        <button class="filter-btn" (click)="filterActivated()">
            <img class="filter-icon" alt="filter" src="assets/img/match-filter-icon.webp" />
        </button>
      </div>
      <div class="card-info">
        <div class="title">
          <div class="card-name">{{ v.titulo}}</div>
          <div class="card-salary">{{ '$ '+ v.salario }}</div>
        </div>
        <!--<div class="card-description">{{ v.description }}</div>-->
        <div class="tags">
          @for(tag of v.habilidades; track tag) {
          <div class="tag">{{ tag }}</div>
          }
        </div>
        <div class="tags">
          @for(tag of v.idiomas; track tag) {
          <div class="tag-language">{{ tag }}</div>
          }
        </div>
        <div class="info-row">
          <div class="info-item">
            <span><img src="assets/img/compania.png" alt="Company" class="emoji" /></span>
            {{ v.empresa.name_empresa }}
          </div>
          <div class="info-item">
            <span><img src="assets/img/reloj-en.png" alt="Schedule" class="emoji" /></span>
            {{ v.modalidad }}
          </div>
        </div>
      </div>
    </div>
  </div>
  }}
</div>
