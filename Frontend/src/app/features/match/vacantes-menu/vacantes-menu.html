<div class="dropdown-container">
  <div class="dropdown-wrapper">
    <button class="dropdown-button" (click)="toggleLista()">
      <span class="button-text">{{ vacanteSeleccionada || 'Selecciona una vacante' }}</span>
    </button>

    @if(mostrarLista){
    <div class="dropdown-list">
      @for(i of vacantes; track i.id){
      <div (click)="seleccionarVacante(i)" class="dropdown-item">
        {{ i.nombre }}
      </div>
      }
    </div>
    }
  </div>
</div>
