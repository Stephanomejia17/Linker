version: "3.9"

services:
    db:
        image: postgres:15
        container_name: db_postgresLinker
        environment:
            POSTGRES_USER: linker
            POSTGRES_PASSWORD: linker
            POSTGRES_DB: linkerdb
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: always

    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin_linker
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@linker.com
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            - "5050:80"
        depends_on:
            - db
        restart: always

    backend:
        image: stephano21/linker-backend:latest
        container_name: backendAppLinker
        depends_on:
            - db
        build: ./Backend
        ports:
            - "3000:3000"
        environment:
            DB_HOST: db
            DB_PORT: 5432
            DB_USER: linker
            DB_PASSWORD: linker
            DB_DATABASE: linkerdb # CAMBIO
        restart: always

    frontend:
        image: stephano21/linker-frontend:latest
        container_name: frontendAppLinker
        build: ./Frontend
        ports:
            - "8090:80"
        depends_on:
            - backend
        restart: always
    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus_linker
        volumes:
            - ./monitoring/prometheus:/etc/prometheus
        ports:
            - "9090:9090"
        depends_on:
            - backend

    grafana:
        image: grafana/grafana:latest
        container_name: grafana_linker
        ports:
            - "3002:3000"
        volumes:
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
        depends_on:
            - prometheus

volumes:
    postgres_data:
    grafana_data:
